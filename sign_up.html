<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  

  <style>
    
.auth_container {
  width: 100%;
  display: flex;
  align-items: center;
  height: 90vh;
}
.auth_img {
  width: 50%;
  height: 100%;
}
.auth_img > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.auth_content {
  width: 50%;
}

@media only screen and (max-width: 800px) {
  .auth_img {
    display: none;
  }
  .auth_content {
    width: 100%;
  }
}

.auth_content {
  padding: 10rem;
}
.form_title {
  font-size: 3.2rem;
}
.auth_p {
  margin: 2rem 0rem;
}
.form_group {
  width: 100%;
}
.form_input {
  width: 100%;
  margin-bottom: 2rem;
  padding: 1rem 0.6rem;
  border: none;
  outline: none;
  border-bottom: 1px solid lightcyan;
}
.form_pass {
  margin-bottom: 1rem;
}
.form_btn {
  width: 100%;
  padding: 1.3rem;
  background-color: rgb(201, 6, 6);
  color: white;
  border: none;
  outline: none;
  margin-bottom: 1.5rem;
}
.form_link {
  color: var(--colo-white-1);
}
.form_group > span {
  margin-top: 2rem;
}

  </style>
</head>
<body>
  <section class="section">
    <div class="auth_container">
      <div class="auth_img">
        <img src="./images/person.jpg" alt="" class="auth_image" />
      </div>
      <div class="auth_content">
        <form action="" class="auth_form">
          <h2 class="form_title">Create your account</h2>
          <p class="auth_p">Enter your details below</p>
          <div class="form_group">
            <input type="text" placeholder="Name" class="form_input" />
          </div>
          <div class="form_group">
            <input type="email" placeholder="Email" class="form_input" />
          </div>
          <div class="form_group form_pass">
            <input
              type="password"
              placeholder="Password"
              class="form_input" />
          </div>
          <div class="form_group">
            <button class="form_btn">
              <a href="#" class="form_link">Create Account</a>
            </button>
          </div>
          <div class="form_group">
            <span
              >Already have an account?
              <a href="./login.html" class="form_auth_link">Login</a></span
            >
          </div>
        </form>
      </div>
    </div>
  </section>

 
</body>
</html>
